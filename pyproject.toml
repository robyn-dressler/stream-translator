[project]
name = "stream-translator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "argostranslate>=1.11.0",
    "libretranslate>=1.9.6",
    "openai-whisper>=20250625",
    "pyaudio>=0.2.14",
    "requests>=2.31.0",
    "soundfile>=0.14.0",
    "speechrecognition>=3.17.0",
    "translate>=3.8.1",
    "twitchio>=3.3.2",
]

[project.optional-dependencies]
cpu = ["torch"]
cuda = ["torch"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu134", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true